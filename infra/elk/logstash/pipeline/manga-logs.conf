input {
  beats {
    port => 5044
  }
}

filter {
  # Redaction Layer 2 (Defence-in-depth on Logstash)
  if [message] {
    mutate {
      gsub => [
        "message", "X-Amz-Signature=[^&\s\"']+", "X-Amz-Signature=[REDACTED]",
        "message", "X-Amz-Credential=[^&\s\"']+", "X-Amz-Credential=[REDACTED]",
        "message", "AIza[0-9A-Za-z_\-]{30,45}", "[REDACTED]",
        "message", "(Authorization:\s*(?:Bearer|Basic)\s+)\S+", "\1[REDACTED]"
      ]
    }
  }

  if ![service][name] {
    mutate {
      add_field => { "[service][name]" => "unknown" }
    }
  }

  if ![event][dataset] {
    mutate {
      add_field => { "[event][dataset]" => "mangalib.%{[service][name]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "%{[event][dataset]}"
    data_stream_namespace => "default"
  }
}
