name: manga-reader-stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: mr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manga_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manga_secret_pwd_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-manga_reader_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - manga_reader_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manga_user} -d ${POSTGRES_DB:-manga_reader_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: mr_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - manga_reader_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mr_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_pwd_change_me}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - ./minio_data:/data
    networks:
      - manga_reader_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/minio:latest
    container_name: mr_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_pwd_change_me}
      MINIO_BUCKET_LIBRARY: ${MINIO_BUCKET_LIBRARY:-manga-library}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS:-user-avatars}
      MINIO_BUCKET_STAGING: ${MINIO_BUCKET_STAGING:-etl-staging}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET_LIBRARY};
      mc mb --ignore-existing local/$${MINIO_BUCKET_AVATARS};
      mc mb --ignore-existing local/$${MINIO_BUCKET_STAGING};
      mc anonymous set download local/$${MINIO_BUCKET_LIBRARY};
      mc anonymous set download local/$${MINIO_BUCKET_AVATARS};
      exit 0;
      "
    networks:
      - manga_reader_net

networks:
  manga_reader_net:
    driver: bridge

