[project]
name = "manga-reader-backend"
version = "2.0.0"
description = "Standalone Manga Reader System v2.0 Backend receiving packages from Manga Data Lake & Storage Pool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "minio>=7.1.15",
    "httpx>=0.24.1",
    "pillow>=9.5.0",
    "python-multipart>=0.0.6",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "arq>=0.26.0",
]

[dependency-groups]
lint = [
    "ruff>=0.9.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
