contract_version: "1.0"
discovered_at: "2026-11-28T01:37:39Z"
live_profile_complete: true

source:
  engine: mongodb
  uri_env_var: ANALYTICS_MONGODB_URI
  fallback_uri_env_var: MONGODB_URI
  primary_database_env_var: DATABASE_NAME
  primary_database_default: manga_library
  pool_database_env_var: POOL_DATABASE_NAME
  pool_database_default: manga_datalake_pool
  default_read_preference: primary
  access_mode: read_only_by_code_and_read_role_when_enabled
  consistency: best_effort_collection_snapshot
  snapshot_partition: "dt=YYYY-MM-DD"
  rating_scale:
    personal_min: 0
    personal_max: 10
    personal_step: 0.5
    observed_personal_min: 1.0
    observed_personal_max: 10.0
    verified_live: true
    external_review_min: 1
    external_review_max: 10
    external_review_step: 1
    observed_external_review_min: 3
    observed_external_review_max: 10
    external_review_verified_live: true
    provider_aggregate_scales:
      mal_score: "0-10_double"
      anilist_mean_score: "0-100_int"

capabilities:
  has_personal_rating: true
  has_read_status: true
  has_personal_review_text: true
  has_external_reviews: true
  has_external_aggregate_score: true
  has_tags: true
  has_canonical_creators: true
  has_chapter_inventory: true
  has_chapter_slots: true
  has_reading_progress_snapshot: true
  has_audit_events: true
  has_ocr_panels: true
  has_ocr_page_scan_state: true
  has_vision_v3: true
  has_tierlists: true
  has_pool_cdc: true

data_availability:
  personal_library_core: ready       # 2864 mangas, 574 rated, 79 tags, 3035 creators
  personal_reviews: ready            # 603 active reviews across 481 mangas
  audit_status_events: partial       # 10659 audit logs; 1002/2864 (34.99%) mangas have update_status events; 0 conflicts
  chapter_inventory: ready           # 2469 physical releases, 2469 slots, 64014 pages across 84 mangas
  external_reviews: sparse           # 23 external reviews across 9 mangas (MAL only)
  external_aggregate_scores: sparse  # 36 AniList mean_score + 10 MAL score across 41 mangas
  ocr_lexical: insufficient_data     # 80 panels on 30 scanned pages across 1 manga / 1 chapter
  tierlists: sparse                  # 2 creator_tierlists, 11 ranked items, snapshot-only
  reading_progress: snapshot_only    # 20 current-position snapshots, no session history

marts_enabled:
  gld_taste_calibration: true
  gld_tag_synergy: true
  gld_series_completion_friction: true
  gld_creator_consistency: true
  gld_review_aspect_profile: true    # mention-only; sentiment disabled until annotated evaluation gate passes
  gld_backlog_velocity: true         # with explicit event-coverage caveat (34.99%)
  gld_metadata_health: true
  gld_external_consensus_gap: true   # low-n / sparse external sample warning enforced
  gld_ocr_lexical_atlas: true        # marked insufficient_data / degraded coverage (1 manga, 30/64014 pages)

entities:
  mangas:
    database: primary
    collection: mangas
    enabled: true
    required: true
    data_classification: personal_library
    primary_key: _id
    primary_key_bson_types: [ObjectId]
    observed_document_count: 2864
    fields:
      title: title
      alt_titles: alt_titles
      personal_rating: personal_rating
      read_status: read_status
      publication_status: status
      content_rating: content_rating
