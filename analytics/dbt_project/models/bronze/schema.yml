version: 2

models:
  - name: brz_mangas
    description: "Thin Bronze view over daily Parquet snapshots of MongoDB mangas."
    columns:
      - name: _source_id
        tests: [not_null]
      - name: _snapshot_date
        tests: [not_null]
      - name: _document_ejson
        tests: [not_null]
  - name: brz_reviews
    description: "Thin Bronze view over daily Parquet snapshots of MongoDB reviews (includes soft-deleted rows)."
    columns:
      - name: _source_id
        tests: [not_null]
      - name: _snapshot_date
        tests: [not_null]
  - name: brz_tags
    description: "Thin Bronze view over daily Parquet snapshots of MongoDB tags."
    columns:
      - name: _source_id
        tests: [not_null]
  - name: brz_creators
