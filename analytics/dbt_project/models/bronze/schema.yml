      - name: _source_id
        tests: [not_null]
  - name: brz_chapters
    description: "Thin Bronze view over daily Parquet snapshots of MongoDB chapters."
    columns:
      - name: _source_id
        tests: [not_null]
  - name: brz_chapter_slots
    description: "Thin Bronze view over daily Parquet snapshots of MongoDB chapter_slots."
    columns:
      - name: _source_id
        tests: [not_null]
  - name: brz_reading_progress
