[project]
name = "manga-library-backend"
version = "0.1.0"
description = "FastAPI backend for Manga Reviews Management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "motor>=3.2.0",
    "pymongo>=4.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "minio>=7.1.15",
    "httpx>=0.24.1",
    "pillow>=9.5.0",
    "python-multipart>=0.0.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "rapidocr-onnxruntime>=1.3",
    "spacy>=3.8",
    "wordninja>=2.0",
    "imagehash>=4.3.2",
    "playwright>=1.63.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
lint = [
    "ruff>=0.9.0",
]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

