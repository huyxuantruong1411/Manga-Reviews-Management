<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Panel Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle High-Tech Grid Pattern -->
  <g opacity="0.12">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
    </pattern>
    <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="160" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="280" r="180" fill="#0ea5e9" opacity="0.08" filter="url(#glow)"/>

  <!-- Left Content Area -->
  <g transform="translate(60, 60)">
    <!-- Pill Badge -->
    <rect width="320" height="30" rx="15" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="18" cy="15" r="4.5" fill="#f59e0b"/>
    <text x="32" y="19" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1.5" class="sans" text-transform="uppercase">
      AI VISION &amp; MANGA ECOSYSTEM
    </text>

    <!-- Main Heading -->
    <text x="0" y="85" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-1" class="title">
      Manga <tspan fill="url(#amberText)">Reviews</tspan> Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" fill="#94a3b8" font-size="16" font-weight="500" class="sans">
      All-in-One Manga Library • Panel Words Detector • MangaDex Reader • AI Reviews
    </text>

    <!-- Feature Pills Strip -->
    <g transform="translate(0, 165)">
      <!-- Pill 1: OpenCV & OCR -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600" class="sans">👁️ OpenCV &amp; RapidOCR</text>
      </g>
      <!-- Pill 2: spaCy NLP -->
      <g transform="translate(192, 0)">
        <rect width="165" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600" class="sans">🧠 spaCy Lemmatizer</text>
      </g>
      <!-- Pill 3: MinIO S3 -->
      <g transform="translate(369, 0)">
        <rect width="135" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600" class="sans">📦 MinIO S3 Sync</text>
      </g>
      <!-- Pill 4: TipTap + Gemini -->
      <g transform="translate(516, 0)">
        <rect width="160" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600" class="sans">✨ Gemini AI Editor</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Illustration Area (Modern Panel & Focus Frame) -->
  <g transform="translate(800, 45)">
    <!-- Decorative Outer Panel -->
    <rect x="0" y="0" width="340" height="270" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Top Header in Mock Card -->
    <g transform="translate(20, 24)">
      <circle cx="6" cy="6" r="4.5" fill="#f43f5e" opacity="0.8"/>
      <circle cx="22" cy="6" r="4.5" fill="#fbbf24" opacity="0.8"/>
      <circle cx="38" cy="6" r="4.5" fill="#10b981" opacity="0.8"/>
      <text x="60" y="10" fill="#64748b" font-size="11" font-weight="600" class="mono">Panel Words Detector v2.0</text>
    </g>

    <!-- Comic Panel Grid Simulation -->
    <g transform="translate(20, 52)">
      <!-- Sub-panel 1 (Top Left) -->
      <rect x="0" y="0" width="140" height="85" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <path d="M 20 50 L 50 25 L 80 55 L 120 20" fill="none" stroke="#475569" stroke-width="2" opacity="0.5"/>
      <circle cx="50" cy="25" r="4" fill="#f59e0b" opacity="0.6"/>

      <!-- Sub-panel 2: Golden Focus Target Panel -->
      <rect x="150" y="0" width="150" height="85" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)"/>
      <rect x="154" y="4" width="45" height="16" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="160" y="16" fill="#fbbf24" font-size="9" font-weight="800" class="sans">MATCHED</text>
      <!-- Speech bubble inside focus panel -->
      <path d="M 165 40 Q 165 30 185 30 L 255 30 Q 275 30 275 45 Q 275 60 255 60 L 205 60 L 195 72 L 200 60 L 185 60 Q 165 60 165 45 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="180" y="48" fill="#fef08a" font-size="10" font-weight="700" class="mono">"chainsaw"</text>

      <!-- Sub-panel 3 (Bottom Wide Panel) -->
      <rect x="0" y="95" width="300" height="95" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Interactive Dictionary Mock inside Bottom Panel -->
      <rect x="12" y="107" width="276" height="70" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="24" y="126" fill="#f8fafc" font-size="12" font-weight="700" class="sans">chainsaw <tspan fill="#38bdf8" font-size="10" font-weight="500">/ˈtʃeɪn.sɔː/</tspan></text>
      <text x="24" y="145" fill="#94a3b8" font-size="10" class="sans">• noun: a mechanical power-driven cutting saw</text>
      <g transform="translate(24, 155)">
        <rect width="50" height="14" rx="4" fill="#0ea5e9" fill-opacity="0.2"/>
        <text x="8" y="10" fill="#38bdf8" font-size="8" font-weight="700" class="mono">NOUN</text>
        <rect x="56" width="60" height="14" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="64" y="10" fill="#34d399" font-size="8" font-weight="700" class="mono">VERB: 12</text>
      </g>
    </g>
  </g>
</svg>
